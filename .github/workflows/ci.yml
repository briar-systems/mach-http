name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # std 8 needs mach 5.12, so this seeds v5.12.0 until the family pin moves (briar-systems/.github#103)
      mach-version: v5.12.0
      # crypto 0.17+ reaches http through quic in the h3-quic subproject
      dit: required
      # qualifies http.h3.connection against the real mach-quic driver. quic lives
      # in this subproject so no consumer of http has to build it
      subprojects: '[{"path": "test/h3-quic", "clean-dep": true}]'

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
