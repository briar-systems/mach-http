[project]
id = "fuzz"
version = "0.0.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.fuzz]
kind = "bin"
entry = "bin/fuzz.mach"
out = "{project.work}/bin/fuzz{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.http]
path = "../.."

# std is selected by ref and its pin is the committed gitlink under dep/,
# as in the other subprojects, because a path dependency carries no pin for it
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
