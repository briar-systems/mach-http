[project]
id = "h3quic"
mach = "^7"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.h3quic]
kind = "static"
entry = "tests.mach"
out = "{project.work}/lib/h3quic{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.http]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "branch/dev"
