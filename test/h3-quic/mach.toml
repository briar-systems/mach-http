[project]
id = "h3quic"
mach = "^5.3"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.h3quic]
kind = "static"
entry = "tests.mach"
out = "lib/h3quic"
targets = ["*"]
link = []
need = []

[dep.http]
path = "../.."

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
ref = "tag/v0.12.1"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v5.3.0"
