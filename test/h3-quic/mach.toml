[project]
id = "h3quic"
mach = "^5.12"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.h3quic]
kind = "static"
entry = "tests.mach"
out = "lib/h3quic"
targets = ["*"]
link = []
need = []

[dep.http]
path = "../.."

# overrides quic, tls and crypto, which still require std ^7, until quic moves to std 8 (briar-systems/mach-std#912)
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v8.0.0"

[dep.quic]
git = "https://github.com/briar-systems/mach-quic"
version = "^0.18"
